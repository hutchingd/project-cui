<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <title>Project CUI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236366f1'/><text x='50' y='70' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>N</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Non-blocking: a hung/slow font CDN must never freeze first paint -->
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" /></noscript>
  <link rel="stylesheet" href="vendor/xterm/xterm.css" />
  <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root"></div>
  <div id="toast-root"></div>

  <!-- UMD libs must load BEFORE monaco-loader (which installs a global `define.amd` that would trap their UMD wrappers) -->
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <!-- React and ReactDOM are served locally so the app never depends on an
       external CDN (slow/blocked CDNs previously caused a blank, hanging page). -->
  <script src="vendor/react/react.production.min.js"></script>
  <script src="vendor/react/react-dom.production.min.js"></script>
  <!-- Monaco Editor (loads LAST; it installs its own AMD loader) - served locally, no CDN needed -->
  <script>
    window.MonacoEnvironment = {
      getWorkerUrl: function () { return window.location.origin + '/vendor/monaco/vs/base/worker/workerMain.js'; }
    };
  </script>
  <script src="vendor/monaco/vs/loader.js"></script>

  <!-- app.jsx is pre-transpiled server-side (served as JS) - no in-browser Babel -->
  <script src="app.jsx"></script>
</body>
</html>
